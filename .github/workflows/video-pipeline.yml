name: Automated Explainer Video Pipeline

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Fonts, Edge-TTS & Headless Browser Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-inter \
            fonts-liberation \
            python3-pip \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64
          pip3 install --break-system-packages edge-tts

      - name: Install Node Packages
        run: npm install --no-audit --no-fund

      - name: Execute Daily Explainer Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/generate-video.js

      - name: Upload Video Artifact for Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-video-${{ github.run_number }}
          path: |
            out/output.mp4
            papercut.json
          retention-days: 5
